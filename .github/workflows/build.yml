name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build binary
        run: ./build.sh

      - name: Unit tests
        run: ./test.sh

      - name: Build app bundle
        run: ./build.sh --app
